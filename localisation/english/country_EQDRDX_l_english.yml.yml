l_english:
 ###National Focuses###
  ##Storyline Tree - Part I##
   EQD_S0000: "[EQD_S0000_SLOC]"
    EQD_S0000_desc: "[EQD_S0000_desc_SLOC]"
    EQD_S0000_CUL: "The Great Reveal"
     EQD_S0000_CUL_desc: "It's time to finally deal with the problems of the living beings in Equestria and of my ¨former friends¨. After all, friendship should last TILL DEATH!"
    EQD_S0000_HEB: "Time for the Showdown"
     EQD_S0000_HEB_desc: "Spellcasters, savages, corrupt oligarchists and followers of the lying sisters... rumors of an insane Cult... There is a lot of cleanup to do."
    EQD_S0000_HEF: "The War"
     EQD_S0000_HEF_desc: "Our magnificent forest has already taken pieces from the lands of Equestria, but this is just the beginning. Our true ruler wants me to spread his grace and message throughout the world!"
    EQD_S0000_HMS: "The War"
     EQD_S0000_HMS_desc: "Finally the time has come to get rid of the threat of my ex-friends' forces ... It's a pity they can't see the truth despite all the signs, but nothing is impossible for my magic."
    EQD_S0000_HSW: "The War"
     EQD_S0000_HSW_desc: "Since the disappearance of the Princesses, Equestria has plunged into chaos and civil war. Time to end this madness and unite everyone under our banner."
    EQD_S0000_HWG: "Time for Action"
     EQD_S0000_HWG_desc: "It's time to throw the dices and see where they bring us..."
   EQD_S0100: "[EQD_S0100_SLOC]"
    EQD_S0100_desc: "[EQD_S0100_desc_SLOC]"
    EQD_S0100_CUL: "Digging The Graves"
     EQD_S0100_CUL_desc: "Hmm, these corpses look so delicious. It would be a shame for them to rot with no one to use them... ultimately what is a state without an army? Alive or dead, an army is an army."
    EQD_S0100_HEB: "Mobilize the Armies"
     EQD_S0100_HEB_desc: "Earth ponies, pegasi, and buffalo; we need to stand against the threat coming from all sides. So grab swords, pies, and boomsticks to stave off them!"
    EQD_S0100_HEF: "Forest Creatures, Take Up Arms!"
     EQD_S0100_HEF_desc: "Ponies, bears, night ponies, and all creatures that hope for a better tomorrow. It's time to take matters into your own paws and show the world the hatred and strength that our beloved forest possesses!"
    EQD_S0100_HMS: "Fight for the Cause"
     EQD_S0100_HMS_desc: "Every unicorn knows perfectly well that we are closer to the ideal race, closer than the three other tribes. The Three other tribes knows that we are the greatest hope for pony kind... And the slaves knows their places, it is time for everyone to enter the war effort."
    EQD_S0100_HSW: "Fully Mobilize Our Nation"
     EQD_S0100_HSW_desc: "The time of war has arrived, we must mobilize all our strength. Griffons, pegasi, earth ponies, the TRULY loyal unicorns and even bats! Everyone has a duty to take up arms in the name of House Stormwing, in the name of Equestria and in the name of the Sisters!"
    EQD_S0100_HWG: "Make a Speech Against Tyranny"
     EQD_S0100_HWG_desc: "Everyone can be persuaded to fight for a just cause if you have charisma and a pile of money."
   EQD_S0101: "[EQD_S0101_SLOC]"
    EQD_S0101_desc: "[EQD_S0101_desc_SLOC]"
    EQD_S0101_CUL: "Underground Cult Industry"
     EQD_S0101_CUL_desc: "The cult had a few factories deep down under the ground from the times when we were still hiding in the shadows. It's time to finally put them to good use."
    EQD_S0101_HEB: "¨Free Will¨ Slavery"
     EQD_S0101_HEB_desc: "It's time for former unicorns to make themselves useful in the factories while we will deal with the war"
    EQD_S0101_HEF: "Our Forest, Our Home"
     EQD_S0101_HEF_desc: "The forest is our gracious shelter, and also thanks to it we can acquire all these resources that will serve us in the coming war."
    EQD_S0101_HMS: "Send the Slaves to the Factories"
     EQD_S0101_HMS_desc: "The slaves shall work for our industry. Anything they can't steal to use in a revolt against us shall be made by them."
    EQD_S0101_HSW: "No Time Like Work"
     EQD_S0101_HSW_desc: "Everyone who's not fighting needs to work at the factory for the sake of our future."
    EQD_S0101_HWG: "More Goods Equal More Work"
     EQD_S0101_HWG_desc: "The more goods our wonderful country owns, the better off it will be. More ponies must sacrifice their lives in factories for the good of the whole country."
   EQD_S0102: "[EQD_S0102_SLOC]"
    EQD_S0102_desc: "[EQD_S0102_desc_SLOC]"
    EQD_S0102_CUL: "Mobilize Our Equipment Factories"
     EQD_S0102_CUL_desc: "I know well that even an infinite army is not able to flood the opponent in any meaningful way without a small amount of weapons."
    EQD_S0102_HEB: "Use Our Contacts"
     EQD_S0102_HEB_desc: "Our good friends from Yakyakistan accepted to sell us a nice amount of their best boomsticks for a low price, and our contacts in Olenia managed to buy us weapon-manufacturing tools for equally good deals."
    EQD_S0102_HEF: "¨Help¨ from the Everfree Liege"
     EQD_S0102_HEF_desc: "Many say we will never be able to hold our own without industry, that the destruction of nature is a necessary and... ¨natural¨ evolution of the world we live in... oh how wrong they are, oh how will they tremble in fear and awe at the power of the forest."
    EQD_S0102_HMS: "Magical Weapon Factories"
     EQD_S0102_HMS_desc: "Who needs laborers if magic can do all the work for us? Especially when said laborers could get the bright idea of using the weapons they make against us."
    EQD_S0102_HSW: "Time for the Militarization of the Country"
     EQD_S0102_HSW_desc: "We will stand no chance in this war without firepower, so I command you all to expand our factories!"
    EQD_S0102_HWG: "Invest in Arms Factories"
     EQD_S0102_HWG_desc: "The time is coming to deal with the threat from our neighbors, but how would we take over Equestria without weapons?"
  EQD_S0200: "Calm Before the Storm"
   EQD_S0200_desc: "[EQD_S0200_desc_SLOC]"
    EQD_S0200_CUL_desc: "It's time for the Cult of Laughter to be revealed to the whole world!"
    EQD_S0200_HEB_desc: "I've always had enough of my ex-friends thinking they were better than me because they had wings or horns. It's time to show Equestria the real strength of the hoof!"
    EQD_S0200_HEF_desc: "Everyone laughed at my approach to the forest and animals, now it's time for the forest to laugh at them."
    EQD_S0200_HMS_desc: "Celestia and Luna's legacies won't end this way, i will show these fanatical fools the only right way!"
    EQD_S0200_HSW_desc: "I will reunite Equestria or die trying!"
    EQD_S0200_HWG_desc: "My old friends... and each of them has all these riches that don't belong to me yet! They must be mine! Only me will be able to afford the throne!"
  ##Storyline Tree - Part II##
   EQD_S0300: "[EQD_S0300_SLOC]"
    EQD_S0300_desc: "[EQD_S0300_desc_SLOC]"
    EQD_S0300_CUL: "Knock Knock"
     EQD_S0300_CUL_desc: "Who's there?"
    EQD_S0300_HEB: "Burn these lunatics at the stake!"
     EQD_S0300_HEB_desc: "Pinkie... or is it even you? No matter. For your good name to remain in the memory of all of us, you must leave that world once and for all."
    EQD_S0300_HEF: "These corpses will return to the ground!"
     EQD_S0300_HEF_desc: "Pinkie Pie has not been with us for a long time, now there is only an abomination that cannot distinguish between murder and happiness... Time to end this slaughter once and for all."
    EQD_S0300_HMS: "A Crusade Against the Greatest Heresy"
     EQD_S0300_HMS_desc: "You are just a failed experiment standing on my path to ascension. No matter if you are Pinkie or something else, i will destroy my greatest mistake here and now."
    EQD_S0300_HSW: "Destroy the lunatics!!"
     EQD_S0300_HSW_desc: "I don't even know if I am talking to Pinkie or to some abomination who stole her body. What I do know is that I have a duty to fulfill; I won't let Equestria fall to madness. The end of your "religion" is near!"
    EQD_S0300_HWG: "Burn What We Cannot Bribe!"
     EQD_S0300_HWG_desc: "These lunatics and their Deity, whatever it truly is, needs to be stopped."
   EQD_S0301: "[EQD_S0301_SLOC]"
    EQD_S0301_desc: "[EQD_S0301_desc_SLOC]"
    EQD_S0301_CUL: "War Against the Destroyer of Smiles"
     EQD_S0301_CUL_desc: "Even an immortal, dark and powerful being like Sombra should be afraid of the arrival of something like me."
    EQD_S0301_HEB: "War Against The Shadow King"
     EQD_S0301_HEB_desc: "King Sombra is one of the most powerful Unicorns walking this world, I think this is reason enough to get rid of him once and for all."
    EQD_S0301_HEF: "War Against the Shadow King"
     EQD_S0301_HEF_desc: "King Sombra has always thought that nothing can overcome his power and knock down the walls of dark magics he can wield. He doesn't realize how wrong he is and he will discover it himself when the forest knocks on his door."
    EQD_S0301_HMS: "War Against The Shadow King"
     EQD_S0301_HMS_desc: "Even if I hightly respect the King's knowledge and power over the arcane, I won't let a power-hungry tyrant, and especially not an enemy of the Sisters, take over Equestria."
    EQD_S0301_HSW: "War Against the Ancient Tyrant"
     EQD_S0301_HSW_desc: "Even Sombra can't stop the storm that is coming for him."
    EQD_S0301_HWG: "War Against Sombra's Tyrany"
     EQD_S0301_HWG_desc: "King Sombra controls the world's largest supply of magic crystals. They can be used as building blocks for buildings, as weapons, fuel or as an additional form of payment ... it doesn't matter how, bring them to me!"
   EQD_S0302: "[EQD_S0302_SLOC]"
    EQD_S0302_desc: "[EQD_S0302_desc_SLOC]"
    EQD_S0302_CUL: "Stopping the not-so Red Tide"
     EQD_S0302_CUL_desc: "I have heard that the communists of Stalliongrad bring hunger and despair to pony throughout their country with their eternal quarrels in government? I think it's time to show them the right way through joy."
    EQD_S0302_HEB: "Stopping the Red Tide"
     EQD_S0302_HEB_desc: "We have a lot in common with the ponies of Stalliongrad, but their refusal to destroy magic users gives us only one option..."
    EQD_S0302_HEF: "Stopping the Red Tide"
     EQD_S0302_HEF_desc: "The communist industry will not be allowed to entrench on nature any longer."
    EQD_S0302_HMS: "Taking Back Stalliongrad"
     EQD_S0302_HMS_desc: "Stalliongrad was briefly under our control before they split away in their damned revolution for ¨Equality¨, bringing their lands back under our control should be a priority, before they can build up like the other Houses did."
    EQD_S0302_HSW: "Stopping the Red Traitors"
     EQD_S0302_HSW_desc: "The ponies from Staliongrad have abandonned us in our hour of need, most of all they have abandonned the princesses! We will make sure their ¨equality¨ goes into oblivion!"
    EQD_S0302_HWG: "Bring Capitalism to the North"
     EQD_S0302_HWG_desc: "Sooner or later Stalliongrad will come south with their armies, so why shouldn't I send some armies north instead?"
   EQD_S0400: "[EQD_S0400_SLOC]"
    EQD_S0400_desc: "[EQD_S0400_desc_SLOC]"
    EQD_S0400_CUL: "It Will Soon Rain Blood"
     EQD_S0400_CUL_desc: "Ohh Rainbow, you had a little more luck during the experiment. But what's your luckiness going to give you when death knocks on your door?"
    EQD_S0400_HEB: "Bring Them Down!"
     EQD_S0400_HEB_desc: "I've been waiting for this duel for a long time, and i know that it will be one of the hardest of all fights I have faced so far."
    EQD_S0400_HEF: "To the Skies We Expand"
     EQD_S0400_HEF_desc: "It's just a matter of time before the forest finally grows up high enough for us to march into Cloudsdale... Pegasus, get ready, for the forest laughs at your control over the weather."
    EQD_S0400_HMS: "Cloudsdale Will Burn"
     EQD_S0400_HMS_desc: "Why can't she understand that i will bring ascension?! Why can't she understand everything it entails?! Ughh, I must take care of this stubborn pegasus, for the future's sake!"
    EQD_S0400_HSW: "Destroy Cloudsdale!"
     EQD_S0400_HSW_desc: "Over my dead body!"
    EQD_S0400_HWG: "Assert Ownership Over the Clouds"
     EQD_S0400_HWG_desc: "Dashie has always been explosive and bathed in hot water, but what she is doing now is sheer madness. All I can do for her is a quick death."
   EQD_S0401: "[EQD_S0401_SLOC]"
    EQD_S0401_desc: "[EQD_S0401_desc_SLOC]"
    EQD_S0401_CUL: "Helping Twilight"
     EQD_S0401_CUL_desc: ""Perfect race" "Higher beings"... Don't you realize Twilight... that you are describing something you already achieved, don't you remember your best experiment? I will bring you the sweet embrace of death, maybe you will see the truth once you are "Reborn"... Hehe..."
    EQD_S0401_HEB: "Break The Horn"
     EQD_S0401_HEB_desc: "Twilight is no better than Sombra. Equestria would be an ideal place were it not for all those spellcasters. It's time to fix Equestria, any Unicorn refusing dehorning shall meet the guillotine!"
    EQD_S0401_HEF: "Break The Horn"
     EQD_S0401_HEF_desc: "Twilight still can't understand that Celestia and Luna will not return from where they are. Time to end the madness playing tricks in her head and show the nation of unicorns a new master."
    EQD_S0401_HMS: "War to Canterlot"
     EQD_S0401_HMS_desc: "Unicorns eat corn."
    EQD_S0401_HSW: "War to the Usurpers"
     EQD_S0401_HSW_desc: "Twilight ... Your senseless pursuit of ascension is proof that you have turned your back on the alicorns, our TRUE legitimate rulers! I was hoping that after that you did to Pinkie you would understand that you made a mistake, but apparently it's too late for you."
    EQD_S0401_HWG: "Break The Horn"
     EQD_S0401_HWG_desc: "Equestria belongs to those who can afford it, not to fanatics. Twilight, it's sad that your fanatical pursuit made you unable to understand anything at all."
   EQD_S0402: "[EQD_S0402_SLOC]"
    EQD_S0402_desc: "[EQD_S0402_desc_SLOC]"
    EQD_S0402_CUL: "Free the Poor from the Joy-Kill Called Money"
     EQD_S0402_CUL_desc: "Hah! Did Rarity really think that her little lies were able to stop the joy that I want to bring into this world? Evidently stupidity lies under the mask of intrigue."
    EQD_S0402_HEB: "Bringing Down the "Gem" of Manehattan"
     EQD_S0402_HEB_desc: "Lies and Plots. It is not a problem for me to look through them, however, this mare is a secret even to me, this is just one of the reasons why she should hang on a string."
    EQD_S0402_HEF: "Restore Glory to the Wasteland"
     EQD_S0402_HEF_desc: "The Everfree Liege wants me remove this unicorn, to take down her corrupt government, and tear down the walls of her monstrous city. I am more than happy to oblige."
    EQD_S0402_HMS: "Destroy the "Gem" of Manehattan"
     EQD_S0402_HMS_desc: "Rarity is a traitor, if she had any higher goals, a real sense of duty, she would use her money and influence to help me bring upon our Ascension, not use it to fill her pockets! It is time for us to take Manehattan, purge it of traitors, and empty their coffers."
    EQD_S0402_HSW: "Destroy the Worthless"
     EQD_S0402_HSW_desc: "They call themselves ¨The Elites¨, they claim to be the richest ponies in all of Equestria, but the truth is that they are worthless, honorless scum! The very antithesis to our ideals! War will come to you very soon Rarity..."
    EQD_S0402_HWG: "Destroy the Power of Money"
     EQD_S0402_HWG_desc: "HA! As if that was possible!"
   EQD_S0500: "[EQD_S0500_SLOC]"
    EQD_S0500_desc: "[EQD_S0500_desc_SLOC]"
    EQD_S0500_CUL: "The Rotten Apple Pie"
     EQD_S0500_CUL_desc: "I can't let some apple orchards stop me from spreading a smile to the whole world!"
    EQD_S0500_HEB: "Time to "Eat the Apple""
     EQD_S0500_HEB_desc: "...what?"
    EQD_S0500_HEF: "Take Care of Our Greatest Threat"
     EQD_S0500_HEF_desc: "Long have you been fighting against the expansion of the forest... no longer. We will take care of you once anf for all, and save your lands from the destruction you cause with your industrialisation!"
    EQD_S0500_HMS: "Destroy Our Most Hated Enemies"
     EQD_S0500_HMS_desc: "You will pay for this betrayal Applejack. If you sacrificed yourself like pinkie, as was your duty, you would have been a hero. Had you simply ran away, you would have only been a traitor. Instead you declared war to Unicornkind and magic itself... you will have to suffer and watch your loved ones die. For i won't let harm come to my race."
    EQD_S0500_HSW: "Flooding Appleloosa"
     EQD_S0500_HSW_desc: "You don't know how long I've waited for this fight Applejack."
    EQD_S0500_HWG: "Destroy Business Competitors"
     EQD_S0500_HWG_desc: "Oh Applejack, even your all-knowing eye cannot save you from the power of Truthful and Gracious Rarity. I am going to get you... and of course make sure i get the legal rights over your industries."
   EQD_S0501: "[EQD_S0501_SLOC]"
    EQD_S0501_desc: "[EQD_S0501_desc_SLOC]"
    EQD_S0501_CUL: "Painting the Forest in Red"
     EQD_S0501_CUL_desc: "The Everfree Forest always terrified ponies, heh, now it's time for it to fear ME."
    EQD_S0501_HEB: "Burning Down the Forest"
     EQD_S0501_HEB_desc: "Why did you turn away from us, Fluttershy? You've seen well what these monsters can do to us. It is a pity that you do not understand anything."
    EQD_S0501_HEF: "Cutting down the Forest"
     EQD_S0501_HEF_desc: "Never will I let that happen!"
    EQD_S0501_HMS: "Purge the Forest"
     EQD_S0501_HMS_desc: "I knew that a forest and animal fanatic like you would one day cause big problems for me and this kingdom, it's a shame you don't want to see the truth!"
    EQD_S0501_HSW: "Drowning the Forest"
     EQD_S0501_HSW_desc: "Although fight against these savages is a great waste of time, I will not let these traitors walk alive in our lands."
    EQD_S0501_HWG: "Civilizing the Forest"
     EQD_S0501_HWG_desc: "Poor Fluttershy. She always cared about her animals so much that she could never remember to take care of herself ... I will do it for her."
   EQD_S0502: "[EQD_S0502_SLOC]"
    EQD_S0502_desc: "[EQD_S0502_desc_SLOC]"
    EQD_S0502_CUL: "Playing Tag with New Mareland"
     EQD_S0502_CUL_desc: "These puny ponies thought they could run away.. hihihi! Let's bring joy to their country with a smile on our faces!"
    EQD_S0502_HEB: "The Pursuit of New Mareland"
     EQD_S0502_HEB_desc: "Since we managed to solve the problem in equestria, it's time to visit our cousins from overseas."
    EQD_S0502_HEF: "Spread the Forest to New Mareland"
     EQD_S0502_HEF_desc: "No one expected that the forest could overcome the sea, and yet no one knew its true power either."
    EQD_S0502_HMS: "Punish New Mareland's Heresy"
     EQD_S0502_HMS_desc: "Ponies from New Mareland thought that the distance which separates us can save them ... hah, magic can do anything you traitorous fools!"
    EQD_S0502_HSW: "Punishing the Traitors"
     EQD_S0502_HSW_desc: "No one can escape from me, not even from across the Ocean!"
    EQD_S0502_HWG: "Taking Back What Belongs to Us"
     EQD_S0502_HWG_desc: "These treacherous ponies thought they could run away from the wrath of all-rich Rarity, they don't know yet how wrong they are!"
  ##Storyline Tree - Part III##
   EQD_S0600: "Equestria Divided"
    EQD_S0600_desc: "[EQD_S0600_desc_SLOC]"
    EQD_S0600_trigger_tooltip: "All §YEquestrian Breakaways§! must be defeated or under §Y[ROOT.GetAdjective]§! control.\n([CUL.Getflag] [CRY.Getflag] [EQC.Getflag] [HEB.Getflag] [HEF.Getflag] [HMS.Getflag] [HSW.Getflag] [HWG.Getflag] [STG.Getflag])"
    EQD_S0600_effect_tooltip: "Any remnants of the §YEquestrian Breakaways§! will be §Oimmediately annexed§! and their territories §Gcored§!.\n([CUL.Getflag] [CRY.Getflag] [EQC.Getflag] [HEB.Getflag] [HEF.Getflag] [HMS.Getflag] [HSW.Getflag] [HWG.Getflag] [STG.Getflag])"
     EQD_S0600_CUL_desc: "We finally reached our goal! All of Equestria is united under the banner of happiness and joy, however this is not the end of our conquests, because this game must last."
     EQD_S0600_HEB_desc: "We have dealt with the whole problem of the civil war, now we must eradicate this evil called magic."
     EQD_S0600_HEF_desc: "In the end we have proved to everyone that the forest is able to absorb all, even the smallest dreams of freedom. And now it's time to fulfill the visions of our Liege."
     EQD_S0600_HMS_desc: "We were able to regain the Equestrian throne, now we must rebuild our empire so that our legitimate rulers have something to reign upon returning. By then, I will take care of everything."
     EQD_S0600_HSW_desc: "We did it. We've beaten our rivals and are the last ones standing. Our oath to the princess is fulfilled at last. Now with our wings and hooves we'll rebuild Equestria in no time."
     EQD_S0600_HWG_desc: "Finally I managed to extend my power to all of equestria. My friends may be dead, but nothing can't stop me now from restoring order of these lands."
   EQD_S0700: "[EQD_S0700_SLOC]"
    EQD_S0700_desc: "[EQD_S0700_desc_SLOC]"
    EQD_S0700_GENR: "Take Care of the Changeling Threat"
    EQD_S0700_CUL: "Liberation of the Changelings Lands"
     EQD_S0700_CUL_desc: "Stupid changelings do not yet know have fun. We know how! and we will prove it to them with an everlasting smile."
     EQD_S0700_HEB_desc: "Changelings have always been a problem for ponies, now... we have to take matters into our own hooves."
     EQD_S0700_HEF_desc: "Even the changelings won't be able to stop the Everfree Forest. Hunters will now become victims."
     EQD_S0700_HMS_desc: "Queen Chrysalis doesn't know yet that the number of her subjects and modernity of her industry are irrelevant when I can knock them out with a snap of my magical hoof."
     EQD_S0700_HSW_desc: "Do these pathetic bugs think they will resist us? Don't make me laugh!"
     EQD_S0700_HWG_desc: "Chrysalis will definitely want to take all my valuables! I order you to crush every single one of them!."
   EQD_S0701: "[EQD_S0701_SLOC]"
    EQD_S0701_desc: "[EQD_S0701_desc_SLOC]"
    EQD_S0701_GENR: "Let Them Come"
     EQD_S0701_CUL_desc: "We are not ready for a proper fight with changelings yet, for now let's prepare a few "parties" for them."
     EQD_S0701_HEB_desc: "Haven't these beasts learned yet that Earth ponies build the best trenches?"
     EQD_S0701_HEF_desc: "The Everfree Forest is an impenetrable, natural defense against these beasts, never will they get trough our walls of thorns. Every lovely bloom, designed to defend..."
     EQD_S0701_HMS_desc: "Should they come for us, the erection of magical defenses and fortresses will ensure great casualties on the changelings armies. Time is on our side, for magic is evergrowing."
     EQD_S0701_HSW_desc: "Even I'm not bold enough to penetrate the infinite nests of changelings, we should take care of the defenses and get ready for the swarms."
    EQD_S0701_HWG: "Bribe Disloyal Changelings"
     EQD_S0701_HWG_desc: "We can bribe her own workers to build up defenses for us! Oh the irony, oh the sweet, sweet power of money!"
