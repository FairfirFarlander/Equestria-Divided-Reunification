l_english:
CUL_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
CUL_assert_control_over_the_crystal_dominion_desc: "Since Sombra is no longer a problem, we can extend eternal joy on the faces of the Crystal Ponies."
CUL_retake_control: "Retake control"
CUL_retake_control_desc: "Since we managed to solve the problem in Equestria, it is time to go to the territories of our beloved neighbors and cowards who are sitting overseas with the thought that they are safe. Joy have no boundaries, and cannot be contained."
HEB_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
HEB_assert_control_over_the_crystal_dominion_desc: "The Crystal Ponies are now free from Sombra's influence, now they will live and work as hard as we do"
HEB_retake_control: "Retake control"
HEB_retake_control_desc: "Since we managed to get control over everything, nothing and no-one stands against our purge... RELEASE THE MAGE HUNTERS!"
HEF_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
HEF_assert_control_over_the_crystal_dominion_desc: "Thanks to our efforts, These crystal wastes finally begins to revive in the richness of our eternal forest."
HEF_modern_society: "Finalized Conquest of Everfree"
HEF_modern_society_desc: "Equestria and Everfree are now indistinguishable, Everfree is Equestria, and Equestria is forever free of Modernisation's destruction."
HEF_agrarian_society: "Spreading the Forest"
HEF_agrarian_society_desc: "The Forest is spreading, the ugly walls of modern cities are being painted in leaves and flowers."
HEF_early_industrial_society: "Reach the Corners"
HEF_early_industrial_society_desc: "Not an inch of Equestria is left untouched by Everfree..."
HEF_transform: "Time to Transform the World"
HEF_transform_desc: "Now that the war is over, the Forest can finally focus on showing it's greatest power: The obsoletisation of modernity."
HEF_retake_control: "Retake control"
HEF_retake_control_desc: "Equestria, no longer will you be plagued by industrialisation and ugly cities, no longer shall modernism destroy nature, those things were obsolete from the start, for the power of the forest protects us, feeds us, and destroys our ennemies."
HMS_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
HMS_assert_control_over_the_crystal_dominion_desc: "The Inquisition has done a great job of bringing the Crystal Ponies to heel. Those who denied Shining armor and Cadence, the Sisters'S teachings or the Hegemony of Magic are dead, the others know their place."
HSW_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
HSW_assert_control_over_the_crystal_dominion_desc: "The ponies of the Crystal Empire can serve us well when fighting against the Changelings, welcome to Equestria!"
HSW_retake_control: "Retake Control"
HSW_retake_control_desc: "The war is over and the rebellions in Equestria are slowly beginning to end. Now the only thing left to do is to restore order in the Crystal Empire and address the problem of changelings."
HWG_assert_control_over_the_crystal_dominion: "Assert Control over the Crystal Empire"
HWG_assert_control_over_the_crystal_dominion_desc: "The Crystal Empire and it's riches now belongs to us, all of the precious crystals are already filling my treasury!"
